<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; font-size: 13px; background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* 상단 패널 */
#top-panel {
  background: #1e2a3a;
  color: #fff;
  padding: 8px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
  border-bottom: 2px solid #2ecc71;
}
#top-panel label { font-size: 11px; color: #aaa; display: block; margin-bottom: 2px; }
#top-panel select, #top-panel input[type="number"] {
  background: #2c3e50; color: #fff; border: 1px solid #4a6278;
  border-radius: 4px; padding: 3px 6px; font-size: 12px; width: 75px;
}
#top-panel input[type="range"] { width: 100px; accent-color: #2ecc71; vertical-align: middle; }
.ctrl-group { display: flex; flex-direction: column; }
.ctrl-row { display: flex; align-items: center; gap: 4px; }
.btn-toggle {
  background: #2c3e50; color: #aaa; border: 1px solid #4a6278;
  border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  transition: all 0.15s;
}
.btn-toggle.active { background: #2ecc71; color: #000; border-color: #2ecc71; font-weight: 600; }
.result-pill {
  background: #2c3e50; border: 1px solid #4a6278; border-radius: 20px;
  padding: 3px 10px; font-size: 11px; color: #7fb3c8; white-space: nowrap;
}
.result-pill span { color: #fff; font-weight: 600; }
#res-series { font-size: 11px; }
.divider { width: 1px; height: 36px; background: #4a6278; margin: 0 2px; flex-shrink: 0; }

/* 메인 영역 */
#main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* 지도 영역 */
#map-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#map { width: 100%; height: 100%; }
#overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

/* 우측 패널 */
#right-panel {
  width: 300px; background: #fff; border-left: 1px solid #ddd;
  display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
}
.rp-section { padding: 12px; border-bottom: 1px solid #eee; }
.rp-section h3 { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }
.rp-section h4 { font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #222; }
.search-wrap { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #eee; background: #f8f8f8; }
.search-wrap input { flex: 1; padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; }
.search-wrap input:focus { border-color: #2ecc71; }
.search-wrap button { padding: 7px 14px; background: #2ecc71; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
.search-wrap button:hover { background: #27ae60; }
.contact-item { font-size: 12px; margin-bottom: 5px; line-height: 1.4; }
.contact-item strong { color: #555; }
.contact-item a { color: #2980b9; text-decoration: none; }
.contact-item a:hover { text-decoration: underline; }
.link-btn {
  display: block; width: 100%; padding: 8px 12px; background: #2980b9; color: #fff;
  border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
  text-align: center; margin-top: 6px; text-decoration: none;
}
.link-btn:hover { background: #1a6ba0; }
.link-btn.green { background: #27ae60; }
.link-btn.green:hover { background: #1e8449; }
.no-data { color: #aaa; font-size: 12px; font-style: italic; }
hr.rp-hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }

<script>
// ── 1. KEPCO 및 지자체 데이터 ─────────────────────────
const KEPCO_DATA = {};
const LOCAL_DATA = {};
</script>
<script>
// ── 2. 계산 모듈 ──────────────────────────────────────
const calc = {
  MODULE_SPECS: {
    hanwha2: { h: 2.464, w: 1.134 },
    hanwha4: { h: 2.382, w: 1.134 },
    trina:   { h: 2.382, w: 1.303 },
  },
  GAP_X: 0.01,
  OFFSET: 0.5,

  fromAngle(angleDeg) {
    const rad = angleDeg * Math.PI / 180;
    const L = 2.465 * Math.cos(rad);
    const D = 2.465 * Math.sin(rad) * 2.0;
    const Gap = L + 0.01;
    const Pitch = L + D;
    return { L, D, Gap, Pitch };
  },

  availableNS(buildingH, ridgeW) {
    return (buildingH / 2) - (ridgeW / 2) - this.OFFSET;
  },

  availableLR(buildingW, ridgeW) {
    return (buildingW / 2) - (ridgeW / 2) - this.OFFSET;
  },

  availableVertical(buildingH) {
    return buildingH - 1.0;
  },

  cols(buildingW, moduleW) {
    const usable = buildingW - 1.0;
    return Math.max(0, Math.floor((usable + this.GAP_X) / (moduleW + this.GAP_X)));
  },

  sideCols(buildingW, ridgeW, moduleW) {
    const usable = this.availableLR(buildingW, ridgeW);
    return Math.max(0, Math.floor((usable + this.GAP_X) / (moduleW + this.GAP_X)));
  },

  southRows(avNS, Gap) {
    return Gap > 0 ? Math.max(0, Math.floor(avNS / Gap)) : 0;
  },

  northLayout(avNS, Gap, Pitch) {
    if (Pitch <= 0 || avNS <= 0) return { rows: 0, hasDouble: false, stdRows: 0 };
    const std = Math.floor(avNS / Pitch);
    let rows = std;
    let hasDouble = false;
    if (std >= 4) {
      const remaining = avNS - std * Pitch;
      if (remaining >= Gap) {
        hasDouble = true;
        rows = std + 1;
      }
    }
    return { rows, hasDouble, stdRows: std };
  },

  verticalLayout(avV, Gap, Pitch) {
    if (Pitch <= 0 || avV <= 0) return { rows: 0, hasDouble: false, stdRows: 0 };
    const std = Math.floor(avV / Pitch);
    let rows = std;
    let hasDouble = false;
    const remaining = avV - std * Pitch;
    if (remaining >= Gap) {
      hasDouble = true;
      rows = std + 1;
    }
    return { rows, hasDouble, stdRows: std };
  }
};
</script>
<script>
// ── 3. 직병렬 최적화 모듈 ─────────────────────────────
const series = {
  solve(total) {
    if (!total || total <= 0) return { text: '-' };

    let best = null;
    let bestDiff = Infinity;

    const update = (combos) => {
      const active = combos.filter(c => c.p > 0);
      if (active.length === 0) return;
      const vals = active.map(c => c.p);
      const diff = Math.max(...vals) - Math.min(...vals);
      if (diff < bestDiff) {
        bestDiff = diff;
        best = active;
      }
    };

    // 2-series combinations (preferred)
    // 11 + 12
    for (let x = 0; x * 11 <= total; x++) {
      const rem = total - x * 11;
      if (rem % 12 === 0) {
        const y = rem / 12;
        update([{s:11,p:x},{s:12,p:y}]);
      }
    }
    // 11 + 13
    for (let x = 0; x * 11 <= total; x++) {
      const rem = total - x * 11;
      if (rem % 13 === 0) {
        const z = rem / 13;
        update([{s:11,p:x},{s:13,p:z}]);
      }
    }
    // 12 + 13
    for (let y = 0; y * 12 <= total; y++) {
      const rem = total - y * 12;
      if (rem % 13 === 0) {
        const z = rem / 13;
        update([{s:12,p:y},{s:13,p:z}]);
      }
    }

    // If no 2-series solution found, try 3-series
    if (!best) {
      for (let x = 0; x * 11 <= total; x++) {
        for (let y = 0; x * 11 + y * 12 <= total; y++) {
          const rem = total - x * 11 - y * 12;
          if (rem >= 0 && rem % 13 === 0) {
            const z = rem / 13;
            update([{s:11,p:x},{s:12,p:y},{s:13,p:z}]);
          }
        }
      }
    }

    if (!best) return { text: '조합 없음' };

    const text = best
      .filter(b => b.p > 0)
      .map(b => `${b.s}직렬 × ${b.p}병렬`)
      .join(' + ');
    return { combos: best, text };
  }
};
</script>
<script>
// ── 4. 배치 계산 모듈 ─────────────────────────────────
const placement = {
  // Forward direction (정방향): horizontal ridge
  forward(state) {
    const spec = calc.MODULE_SPECS[state.model];
    const { Gap, Pitch, L } = calc.fromAngle(state.angle);
    const mW = spec.w;
    const mL = L; // projected height used for spacing

    const avNS = calc.availableNS(state.buildingH, state.ridgeW);
    const numCols = calc.cols(state.buildingW, mW);

    // South rows: tight placement (always Gap)
    const sRows = calc.southRows(avNS, Gap);
    // North layout
    const nLayout = state.spaced
      ? calc.northLayout(avNS, Gap, Pitch)
      : { rows: Math.floor(avNS / Gap), hasDouble: false, stdRows: Math.floor(avNS / Gap) };

    const southModules = [];
    const northModules = [];

    // South: Y=0.5 (offset line) going northward, step = Gap
    for (let r = 0; r < sRows; r++) {
      for (let c = 0; c < numCols; c++) {
        const x = calc.OFFSET + c * (mW + calc.GAP_X);
        const y = calc.OFFSET + r * Gap;
        southModules.push({ x, y, w: mW, h: mL });
      }
    }
    const southUsed = sRows > 0 ? (sRows - 1) * Gap + mL : 0;

    // North: modules placed from ridge southward (Y decreasing from ridge)
    // Ridge south edge Y coordinate in building space
    const ridgeSouthY = state.buildingH / 2 + state.ridgeW / 2;

    const { rows: nRows, hasDouble: nHasDouble, stdRows: nStdRows } = nLayout;

    for (let r = 0; r < nRows; r++) {
      let dy; // distance from ridge south edge downward
      if (nRows <= 3) {
        // 3 or fewer: tight Gap spacing
        dy = r * Gap;
      } else {
        if (!nHasDouble || r < nStdRows) {
          dy = r * (state.spaced ? Pitch : Gap);
        } else {
          // Double row: last module placed Gap after the last standard module
          dy = (nStdRows - 1) * (state.spaced ? Pitch : Gap) + Gap;
        }
      }
      for (let c = 0; c < numCols; c++) {
        const x = calc.OFFSET + c * (mW + calc.GAP_X);
        // North modules go from ridge downward (south), so y decreases
        const y = ridgeSouthY - calc.OFFSET - dy - mL;
        northModules.push({ x, y, w: mW, h: mL });
      }
    }

    let northUsed;
    if (nRows === 0) {
      northUsed = 0;
    } else if (nRows <= 3) {
      northUsed = (nRows - 1) * Gap + mL;
    } else if (nHasDouble) {
      northUsed = (nStdRows - 1) * (state.spaced ? Pitch : Gap) + Gap + mL;
    } else {
      northUsed = (nRows - 1) * (state.spaced ? Pitch : Gap) + mL;
    }

    return {
      southModules, northModules,
      southRows: sRows, northRows: nRows,
      southUsed, northUsed,
      cols: numCols, avNS
    };
  },

  // Reverse direction (역방향): vertical ridge
  reverse(state) {
    const spec = calc.MODULE_SPECS[state.model];
    const { Gap, Pitch, L } = calc.fromAngle(state.angle);
    const mW = spec.w;
    const mL = L;

    const avV = calc.availableVertical(state.buildingH);
    const numSideCols = calc.sideCols(state.buildingW, state.ridgeW, mW);
    const vLayout = state.spaced
      ? calc.verticalLayout(avV, Gap, Pitch)
      : { rows: Math.floor(avV / Gap), hasDouble: false, stdRows: Math.floor(avV / Gap) };

    const { rows, hasDouble, stdRows } = vLayout;
    const yStep = state.spaced ? Pitch : Gap;

    const ridgeCenterX = state.buildingW / 2;
    const ridgeLeftX = ridgeCenterX - state.ridgeW / 2;
    const ridgeRightX = ridgeCenterX + state.ridgeW / 2;

    const leftModules = [];
    const rightModules = [];

    for (let r = 0; r < rows; r++) {
      let dy;
      if (!hasDouble || r < stdRows) {
        dy = r * yStep;
      } else {
        dy = (stdRows - 1) * yStep + Gap;
      }
      const y = calc.OFFSET + dy;

      // Left side: from ridgeLeftX going left (x decreasing)
      for (let c = 0; c < numSideCols; c++) {
        const x = ridgeLeftX - calc.OFFSET - (c + 1) * mW - c * calc.GAP_X;
        leftModules.push({ x, y, w: mW, h: mL });
      }
      // Right side: from ridgeRightX going right (x increasing)
      for (let c = 0; c < numSideCols; c++) {
        const x = ridgeRightX + calc.OFFSET + c * (mW + calc.GAP_X);
        rightModules.push({ x, y, w: mW, h: mL });
      }
    }

    let usedV;
    if (rows === 0) {
      usedV = 0;
    } else if (hasDouble) {
      usedV = (stdRows - 1) * yStep + Gap + mL;
    } else {
      usedV = (rows - 1) * yStep + mL;
    }

    return {
      leftModules, rightModules,
      rows, sideCols: numSideCols,
      usedV, avV
    };
  }
};
</script>
<script>
// ── 5. 렌더링 모듈 ────────────────────────────────────
const render = {
  draw() {
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!mapCtrl.map) return;

    const st = ui.getState();
    const mpp = mapCtrl.mPerPx; // meters per pixel
    const bCenter = mapCtrl.latLngToPx(mapCtrl.buildingLatLng);

    // Convert building-local meter coords to canvas pixels
    // Building origin (0,0) = SW corner; canvas Y is inverted (down = +)
    const toCanvasX = (mx) => bCenter.x + (mx - st.buildingW / 2) / mpp;
    const toCanvasY = (my) => bCenter.y + (st.buildingH / 2 - my) / mpp;
    const px = (m) => m / mpp;

    // 1. Building outline (purple)
    ctx.strokeStyle = '#8B008B';
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    ctx.strokeRect(
      toCanvasX(0),
      toCanvasY(st.buildingH),
      px(st.buildingW),
      px(st.buildingH)
    );

    // 2. 500mm offset red dashed line
    const off = calc.OFFSET;
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(
      toCanvasX(off),
      toCanvasY(st.buildingH - off),
      px(st.buildingW - off * 2),
      px(st.buildingH - off * 2)
    );
    ctx.setLineDash([]);

    // 3. Ridge (gray band)
    ctx.fillStyle = '#999999';
    if (st.forward) {
      // Horizontal ridge at vertical center
      const ridgeMidY = st.buildingH / 2;
      ctx.fillRect(
        toCanvasX(0),
        toCanvasY(ridgeMidY + st.ridgeW / 2),
        px(st.buildingW),
        px(st.ridgeW)
      );
    } else {
      // Vertical ridge at horizontal center
      const ridgeMidX = st.buildingW / 2;
      ctx.fillRect(
        toCanvasX(ridgeMidX - st.ridgeW / 2),
        toCanvasY(st.buildingH),
        px(st.ridgeW),
        px(st.buildingH)
      );
    }

    // 4. Modules
    const borderPx = Math.max(1, px(0.002));

    const drawModules = (modules) => {
      modules.forEach(m => {
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(toCanvasX(m.x), toCanvasY(m.y + m.h), px(m.w), px(m.h));
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = borderPx;
        ctx.setLineDash([]);
        ctx.strokeRect(toCanvasX(m.x), toCanvasY(m.y + m.h), px(m.w), px(m.h));
      });
    };

    let result;
    if (st.forward) {
      result = placement.forward(st);
      drawModules(result.southModules);
      drawModules(result.northModules);
    } else {
      result = placement.reverse(st);
      drawModules(result.leftModules);
      drawModules(result.rightModules);
    }

    // 5. Update top panel
    ui.updateResults(result);
  }
};
</script>
<script>
// ── 6. 지도 컨트롤 모듈 ───────────────────────────────
const mapCtrl = {
  map: null,
  mPerPx: 1,
  buildingLatLng: null,

  init() {
    const container = document.getElementById('map');
    const options = {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: 3
    };
    this.map = new kakao.maps.Map(container, options);
    this.buildingLatLng = options.center;
    this.resizeCanvas();
    this.updateScale();

    kakao.maps.event.addListener(this.map, 'zoom_changed', () => {
      this.updateScale(); render.draw && render.draw();
    });
    kakao.maps.event.addListener(this.map, 'center_changed', () => {
      render.draw && render.draw();
    });
    window.addEventListener('resize', () => {
      this.resizeCanvas(); this.updateScale(); render.draw && render.draw();
    });

    const canvas = document.getElementById('overlay-canvas');
    canvas.style.pointerEvents = 'auto';
    let dragging = false;
    let dragStartPx = null;
    let dragStartLatLng = null;

    canvas.addEventListener('mousedown', (e) => {
      const st = ui.getState();
      const px = this.canvasXY(e);
      const bpx = this.latLngToPx(this.buildingLatLng);
      const halfW = (st.buildingW / 2) / this.mPerPx;
      const halfH = (st.buildingH / 2) / this.mPerPx;
      if (Math.abs(px.x - bpx.x) < halfW && Math.abs(px.y - bpx.y) < halfH) {
        dragging = true;
        dragStartPx = px;
        dragStartLatLng = this.buildingLatLng;
        e.preventDefault();
      }
    });
    canvas.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const px = this.canvasXY(e);
      const dx = (px.x - dragStartPx.x) * this.mPerPx;
      const dy = (px.y - dragStartPx.y) * this.mPerPx;
      this.buildingLatLng = this.offsetLatLng(dragStartLatLng, dx, -dy);
      render.draw && render.draw();
    });
    canvas.addEventListener('mouseup', () => { dragging = false; });
    canvas.addEventListener('mouseleave', () => { dragging = false; });
  },

  resizeCanvas() {
    const wrap = document.getElementById('map-wrap');
    const canvas = document.getElementById('overlay-canvas');
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
  },

  updateScale() {
    const proj = this.map.getProjection();
    const center = this.map.getCenter();
    const p1 = proj.pointFromCoords(center);
    const offsetLng = new kakao.maps.LatLng(center.getLat(), center.getLng() + 0.001);
    const p2 = proj.pointFromCoords(offsetLng);
    const pxDist = Math.abs(p2.x - p1.x);
    const mDist = 111320 * Math.cos(center.getLat() * Math.PI / 180) * 0.001;
    this.mPerPx = pxDist > 0 ? mDist / pxDist : 1;
  },

  latLngToPx(latlng) {
    const proj = this.map.getProjection();
    const mapPt = proj.pointFromCoords(latlng);
    const centerPt = proj.pointFromCoords(this.map.getCenter());
    const canvas = document.getElementById('overlay-canvas');
    return {
      x: canvas.width / 2 + (mapPt.x - centerPt.x),
      y: canvas.height / 2 + (mapPt.y - centerPt.y)
    };
  },

  canvasXY(e) {
    const canvas = document.getElementById('overlay-canvas');
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  },

  offsetLatLng(latlng, dxM, dyM) {
    const lat = latlng.getLat() + (dyM / 111320);
    const lng = latlng.getLng() + (dxM / (111320 * Math.cos(latlng.getLat() * Math.PI / 180)));
    return new kakao.maps.LatLng(lat, lng);
  }
};
</script>
