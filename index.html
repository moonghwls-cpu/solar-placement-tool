<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태양광 배치 툴</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; font-size: 13px; background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* 상단 패널 */
#top-panel {
  background: #1e2a3a;
  color: #fff;
  padding: 8px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
  border-bottom: 2px solid #2ecc71;
}
#top-panel label { font-size: 11px; color: #aaa; display: block; margin-bottom: 2px; }
#top-panel select, #top-panel input[type="number"] {
  background: #2c3e50; color: #fff; border: 1px solid #4a6278;
  border-radius: 4px; padding: 3px 6px; font-size: 12px; width: 75px;
}
#top-panel input[type="range"] { width: 100px; accent-color: #2ecc71; vertical-align: middle; }
.ctrl-group { display: flex; flex-direction: column; }
.ctrl-row { display: flex; align-items: center; gap: 4px; }
.btn-toggle {
  background: #2c3e50; color: #aaa; border: 1px solid #4a6278;
  border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  transition: all 0.15s;
}
.btn-toggle.active { background: #2ecc71; color: #000; border-color: #2ecc71; font-weight: 600; }
.btn-toggle.move-active { background: #e67e22; color: #fff; border-color: #e67e22; font-weight: 600; }
.btn-toggle.danger { border-color: #c0392b; color: #e74c3c; }
.btn-toggle.danger:hover { background: #c0392b; color: #fff; }
.result-pill {
  background: #2c3e50; border: 1px solid #4a6278; border-radius: 20px;
  padding: 3px 10px; font-size: 11px; color: #7fb3c8; white-space: nowrap;
}
.result-pill span { color: #fff; font-weight: 600; }
.result-pill.cap { border-color: #2ecc71; }
.result-pill.cap span { color: #2ecc71; }
#res-series { font-size: 11px; color: #f1c40f; border-color: #6b5d1a; }
.divider { width: 1px; height: 36px; background: #4a6278; margin: 0 2px; flex-shrink: 0; }

/* 메인 영역 */
#main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* 지도 영역 */
#map-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#map { width: 100%; height: 100%; }
/* 기본은 이벤트 통과(지도 패닝/줌 동작). 건물 이동 모드에서만 캔버스가 이벤트를 받음 */
/* z-index 4: 카카오 타일 레이어(최대 z-index 2) 위에 오버레이가 보이도록 */
#overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
#overlay-canvas.move-mode { pointer-events: auto; cursor: move; }
#move-hint {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(230,126,34,0.95); color: #fff; padding: 6px 14px;
  border-radius: 20px; font-size: 12px; font-weight: 600; display: none;
  z-index: 5; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
#move-hint.show { display: block; }
#nomap-banner {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(52,73,94,0.96); color: #fff; padding: 6px 14px;
  border-radius: 20px; font-size: 12px; font-weight: 600; display: none;
  z-index: 5; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
#nomap-banner.show { display: block; }

/* 우측 패널 */
#right-panel {
  width: 300px; background: #fff; border-left: 1px solid #ddd;
  display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
}
.rp-section { padding: 12px; border-bottom: 1px solid #eee; }
.rp-section h3 { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }
.rp-section h4 { font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #222; }
.search-wrap { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #eee; background: #f8f8f8; }
.search-wrap input { flex: 1; padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; }
.search-wrap input:focus { border-color: #2ecc71; }
.search-wrap button { padding: 7px 14px; background: #2ecc71; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
.search-wrap button:hover { background: #27ae60; }
.contact-item { font-size: 12px; margin-bottom: 5px; line-height: 1.4; }
.contact-item strong { color: #555; }
.contact-item a { color: #2980b9; text-decoration: none; }
.contact-item a:hover { text-decoration: underline; }
.link-btn {
  display: block; width: 100%; padding: 8px 12px; background: #2980b9; color: #fff;
  border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
  text-align: center; margin-top: 6px; text-decoration: none;
}
.link-btn:hover { background: #1a6ba0; }
.link-btn.green { background: #27ae60; }
.link-btn.green:hover { background: #1e8449; }
.no-data { color: #aaa; font-size: 12px; font-style: italic; }
hr.rp-hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
</style>
</head>
<body>

<!-- 상단 컨트롤 패널 -->
<div id="top-panel">
  <div class="ctrl-group">
    <label>모듈 모델</label>
    <select id="sel-model">
      <option value="hanwha2">한화 2등급</option>
      <option value="hanwha4">한화 4등급</option>
      <option value="trina">트리나</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>출력 (Wp)</label>
    <input type="number" id="inp-wp" value="500" min="1" max="1000" step="1">
  </div>

  <div class="divider"></div>

  <div class="ctrl-group">
    <label>건물 가로 (m)</label>
    <input type="number" id="inp-bw" value="20" min="1" max="500" step="0.5">
  </div>
  <div class="ctrl-group">
    <label>건물 세로 (m)</label>
    <input type="number" id="inp-bh" value="30" min="1" max="500" step="0.5">
  </div>
  <div class="ctrl-group">
    <label>용마루 폭 (m)</label>
    <input type="number" id="inp-ridge" value="0.5" min="0.1" max="5" step="0.1">
  </div>

  <div class="divider"></div>

  <div class="ctrl-group">
    <label>경사각: <span id="lbl-angle">10</span>°</label>
    <div class="ctrl-row">
      <span style="font-size:10px;color:#aaa">0°</span>
      <input type="range" id="sl-angle" min="0" max="20" value="10" step="1">
      <span style="font-size:10px;color:#aaa">20°</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="ctrl-group">
    <label>배치 방향</label>
    <div class="ctrl-row">
      <button class="btn-toggle active" id="btn-forward">정방향</button>
      <button class="btn-toggle" id="btn-reverse">역방향</button>
    </div>
  </div>
  <div class="ctrl-group">
    <label>배치 모드</label>
    <div class="ctrl-row">
      <button class="btn-toggle" id="btn-tight">밀착</button>
      <button class="btn-toggle active" id="btn-spaced">이격</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="ctrl-group">
    <label>보기</label>
    <div class="ctrl-row">
      <button class="btn-toggle active" id="btn-mapview">지도</button>
      <button class="btn-toggle" id="btn-drawview">도면</button>
    </div>
  </div>
  <div class="ctrl-group">
    <label>지도</label>
    <div class="ctrl-row">
      <button class="btn-toggle active" id="btn-road">일반</button>
      <button class="btn-toggle" id="btn-sat">위성</button>
    </div>
  </div>
  <div class="ctrl-group">
    <label>건물 위치</label>
    <div class="ctrl-row">
      <button class="btn-toggle" id="btn-move" title="켜면 건물을 드래그로 이동, 끄면 지도 이동">이동</button>
      <button class="btn-toggle" id="btn-center" title="건물을 현재 지도 중심으로 이동">중심맞춤</button>
    </div>
  </div>
  <div class="ctrl-group">
    <label>건물 도구</label>
    <div class="ctrl-row">
      <button class="btn-toggle" id="btn-measure" title="지도에서 두 점을 클릭해 거리(m) 측정">거리측정</button>
      <button class="btn-toggle" id="btn-draw" title="건물 두 모서리(대각)를 클릭하면 가로·세로 자동 산출 후 배치">건물그리기</button>
      <button class="btn-toggle danger" id="btn-clear" title="건물·모듈·측정 모두 지우기">지우기</button>
    </div>
  </div>
  <div class="ctrl-group">
    <label>건물 회전: <span id="lbl-rot">0</span>°</label>
    <div class="ctrl-row">
      <input type="range" id="sl-rot" min="0" max="360" value="0" step="1" style="width:90px">
    </div>
  </div>

  <div class="divider"></div>

  <div class="result-pill">L&nbsp;<span id="res-L">-</span>m</div>
  <div class="result-pill">Gap&nbsp;<span id="res-Gap">-</span>m</div>
  <div class="result-pill">Pitch&nbsp;<span id="res-Pitch">-</span>m</div>
  <div class="result-pill">남측이격&nbsp;<span id="res-south">-</span>m</div>
  <div class="result-pill">북측이격&nbsp;<span id="res-north">-</span>m</div>
  <div class="result-pill">모듈&nbsp;<span id="res-count">-</span>장</div>
  <div class="result-pill cap">용량&nbsp;<span id="res-cap">-</span>kW</div>
  <div class="result-pill" id="res-series">직병렬: -</div>
</div>

<div id="main">

</div>

<script>
// ── 2. 계산 모듈 ──────────────────────────────────────
// 좌표계: 미터 단위. 원점(0,0)=건물 남서(SW) 모서리. +X=동, +Y=북.
const calc = {
  MODULE_SPECS: {
    hanwha2: { h: 2.464, w: 1.134 },
    hanwha4: { h: 2.382, w: 1.134 },
    trina:   { h: 2.382, w: 1.303 },
  },
  GAP_X: 0.01,   // X축 모듈 간격(항상 10mm)
  OFFSET: 0.5,   // 외벽 안쪽 이격(500mm) — 외벽에만 적용, 용마루 쪽엔 적용 안 함

  // 경사각 → L, D, Gap, Pitch
  fromAngle(angleDeg) {
    const rad = angleDeg * Math.PI / 180;
    const L = 2.465 * Math.cos(rad);       // 수평 투영 길이
    const D = 2.465 * Math.sin(rad) * 2.0; // 그림자 이격 거리
    const Gap = L + 0.01;                  // 밀착 배치 간격(투영길이+10mm)
    const Pitch = L + D;                   // 표준 이격 배치 간격(투영길이+그림자)
    return { L, D, Gap, Pitch };
  },

  // 정방향: 한쪽 지붕(남 또는 북)의 가용 길이 — 용마루 반폭 + 외벽 이격 1개를 제외
  availableNS(buildingH, ridgeW) { return (buildingH / 2) - (ridgeW / 2) - this.OFFSET; },
  // 역방향: 한쪽 지붕(좌 또는 우)의 가용 폭
  availableLR(buildingW, ridgeW) { return (buildingW / 2) - (ridgeW / 2) - this.OFFSET; },
  // 역방향 세로 가용 길이 — 남/북 외벽 이격 2개 제외
  availableVertical(buildingH) { return buildingH - 1.0; },

  // 정방향 가로 열 수 (가로 가용폭 = 건물가로 - 1.0)
  cols(buildingW, moduleW) {
    const usable = buildingW - 1.0;
    return Math.max(0, Math.floor((usable + this.GAP_X) / (moduleW + this.GAP_X)));
  },
  // 역방향 한쪽 지붕 열 수
  sideCols(buildingW, ridgeW, moduleW) {
    const usable = this.availableLR(buildingW, ridgeW);
    return Math.max(0, Math.floor((usable + this.GAP_X) / (moduleW + this.GAP_X)));
  },

  // 단순 단수(간격 step 기준)
  rowsByStep(available, step) {
    return step > 0 ? Math.max(0, Math.floor(available / step)) : 0;
  },

  // 정방향 북측 단 구성: 표준은 Pitch, 4단 이상이면 마지막 Double Row 검사
  // 반환: { rows, hasDouble, stdRows }
  northLayout(avNS, Gap, Pitch) {
    if (Pitch <= 0 || avNS <= 0) return { rows: 0, hasDouble: false, stdRows: 0 };
    const std = Math.floor(avNS / Pitch);
    let rows = std, hasDouble = false;
    if (std >= 4) {
      const remaining = avNS - std * Pitch;
      if (remaining >= Gap) { hasDouble = true; rows = std + 1; }
    }
    return { rows, hasDouble, stdRows: std };
  },

  // 역방향 세로 단 구성: 표준 Pitch + 마지막 Double Row 검사
  verticalLayout(avV, Gap, Pitch) {
    if (Pitch <= 0 || avV <= 0) return { rows: 0, hasDouble: false, stdRows: 0 };
    const std = Math.floor(avV / Pitch);
    let rows = std, hasDouble = false;
    const remaining = avV - std * Pitch;
    if (remaining >= Gap) { hasDouble = true; rows = std + 1; }
    return { rows, hasDouble, stdRows: std };
  },

  // 모듈 배열의 Y방향 실사용 길이 = (북단 최대 far edge) - baseline. 실제 배치 기준.
  usedLengthY(modules, baseline) {
    if (!modules.length) return 0;
    let maxFar = -Infinity;
    for (const m of modules) maxFar = Math.max(maxFar, m.y + m.h);
    return maxFar - baseline;
  }
};
</script>
<script>
// ── 3. 직병렬 최적 균등 분배 모듈 ─────────────────────
// 11X + 12Y + 13Z = total, 나머지 0.
// 우선순위: 1)나머지0  2)직렬 종류 ≤2(2개 우선)  3)병렬 수 차 최소  4)총 병렬 수 과도하지 않음
const series = {
  solve(total) {
    if (!total || total <= 0) return { text: '-' };

    const score = (combo) => {
      const vals = combo.map(c => c.p);
      return { diff: Math.max(...vals) - Math.min(...vals), sum: vals.reduce((a, b) => a + b, 0) };
    };
    // 더 좋은 조합인지(차 작고, 동률이면 총 병렬 적음)
    const better = (a, b) => {
      const sa = score(a), sb = score(b);
      if (sa.diff !== sb.diff) return sa.diff < sb.diff;
      return sa.sum < sb.sum;
    };

    const pool = [];
    // 단일 직렬(종류 1개)
    [11, 12, 13].forEach(s => { if (total % s === 0) pool.push([{ s, p: total / s }]); });
    // 2개 직렬 조합
    const pairs = [[11, 12], [11, 13], [12, 13]];
    for (const [a, b] of pairs) {
      for (let x = 1; x * a < total; x++) {
        const rem = total - x * a;
        if (rem > 0 && rem % b === 0) pool.push([{ s: a, p: x }, { s: b, p: rem / b }]);
      }
    }

    let candidates = pool;
    // ≤2 직렬로 불가능할 때만 3개 직렬 허용
    if (candidates.length === 0) {
      for (let x = 1; x * 11 < total; x++) {
        for (let y = 1; x * 11 + y * 12 < total; y++) {
          const rem = total - x * 11 - y * 12;
          if (rem > 0 && rem % 13 === 0) candidates.push([{ s: 11, p: x }, { s: 12, p: y }, { s: 13, p: rem / 13 }]);
        }
      }
    }

    if (candidates.length === 0) return { text: '조합 없음' };

    let best = candidates[0];
    for (const c of candidates) if (better(c, best)) best = c;

    const text = best
      .filter(b => b.p > 0)               // 병렬 0인 직렬은 표시 안 함
      .map(b => `${b.s}직렬 × ${b.p}병렬`)
      .join(' + ');
    return { combos: best, text };
  }
};
</script>
<script>
// ── 4. 배치 계산 모듈 ─────────────────────────────────
// 모든 모듈은 미터 좌표 {x, y, w, h}. x=서쪽 모서리, y=남쪽 모서리, h=투영길이 L.
const placement = {
  // 정방향: 가로 용마루(건물을 남/북 지붕으로 반분)
  forward(state) {
    const spec = calc.MODULE_SPECS[state.model];
    const { Gap, Pitch, L } = calc.fromAngle(state.angle);
    const mW = spec.w, mL = L;

    const avNS = calc.availableNS(state.buildingH, state.ridgeW);
    const numCols = calc.cols(state.buildingW, mW);

    const ridgeSouthEdge = state.buildingH / 2 - state.ridgeW / 2; // 용마루 남쪽 경계
    const ridgeNorthEdge = state.buildingH / 2 + state.ridgeW / 2; // 용마루 북쪽 경계

    const south = [];
    const north = [];

    // X좌표(공통): 서측 외벽 0.5m 안쪽에서 시작, 남는 폭은 동쪽에만
    const colX = (c) => calc.OFFSET + c * (mW + calc.GAP_X);

    // ── 남쪽 지붕: 밀착(Gap). 최남단 500mm 선에 붙여 북쪽으로 ──
    const sRows = calc.rowsByStep(avNS, Gap);
    for (let r = 0; r < sRows; r++) {
      const y = calc.OFFSET + r * Gap;
      for (let c = 0; c < numCols; c++) south.push({ x: colX(c), y, w: mW, h: mL });
    }

    // ── 북쪽 지붕: 용마루 북쪽 경계에 붙여 북쪽으로 ──
    const nLayout = state.spaced
      ? calc.northLayout(avNS, Gap, Pitch)
      : { rows: calc.rowsByStep(avNS, Gap), hasDouble: false, stdRows: calc.rowsByStep(avNS, Gap) };
    const { rows: nRows, hasDouble: nDouble, stdRows: nStd } = nLayout;
    const nStep = state.spaced ? Pitch : Gap;

    for (let r = 0; r < nRows; r++) {
      let dy; // 용마루 북쪽 경계로부터 북쪽 거리
      if (nRows <= 3) {
        dy = r * Gap;                          // 3단 이하: 이격 없이 연속(Gap)
      } else if (!nDouble || r < nStd) {
        dy = r * nStep;                        // 표준 이격(Pitch)
      } else {
        dy = (nStd - 1) * nStep + Gap;         // 마지막 Double Row: 직전 표준 모듈에 10mm만 띄움
      }
      const y = ridgeNorthEdge + dy;
      for (let c = 0; c < numCols; c++) north.push({ x: colX(c), y, w: mW, h: mL });
    }

    // 실제 배치 기준 이격(소수 셋째 자리 표시는 UI에서)
    const southUsed = calc.usedLengthY(south, calc.OFFSET);
    const northUsed = calc.usedLengthY(north, ridgeNorthEdge);
    const southGap = Math.max(0, avNS - southUsed);
    const northGap = Math.max(0, avNS - northUsed);

    return {
      mode: 'forward',
      modules: south.concat(north), south, north,
      cols: numCols, southRows: sRows, northRows: nRows,
      avNS, southGap, northGap,
      total: south.length + north.length,
      ridgeSouthEdge, ridgeNorthEdge,
    };
  },

  // 역방향: 세로 용마루(건물을 좌/우 지붕으로 반분), 좌우 완전 대칭
  reverse(state) {
    const spec = calc.MODULE_SPECS[state.model];
    const { Gap, Pitch, L } = calc.fromAngle(state.angle);
    const mW = spec.w, mL = L;

    const avV = calc.availableVertical(state.buildingH);
    const numSideCols = calc.sideCols(state.buildingW, state.ridgeW, mW);

    const vLayout = state.spaced
      ? calc.verticalLayout(avV, Gap, Pitch)
      : { rows: calc.rowsByStep(avV, Gap), hasDouble: false, stdRows: calc.rowsByStep(avV, Gap) };
    const { rows, hasDouble, stdRows } = vLayout;
    const yStep = state.spaced ? Pitch : Gap;

    const ridgeLeftX = state.buildingW / 2 - state.ridgeW / 2;  // 용마루 좌측 경계
    const ridgeRightX = state.buildingW / 2 + state.ridgeW / 2; // 용마루 우측 경계

    const left = [];
    const right = [];

    for (let r = 0; r < rows; r++) {
      let dy;
      if (!hasDouble || r < stdRows) dy = r * yStep;
      else dy = (stdRows - 1) * yStep + Gap;     // 마지막 Double Row
      const y = calc.OFFSET + dy;                // 최남단 500mm 선에 붙여 북쪽으로

      // 좌측: 용마루 좌측 경계에 붙여 서쪽으로. 남는 폭은 좌측 외벽에.
      for (let c = 0; c < numSideCols; c++) {
        const x = ridgeLeftX - (c + 1) * mW - c * calc.GAP_X;
        left.push({ x, y, w: mW, h: mL });
      }
      // 우측: 용마루 우측 경계에 붙여 동쪽으로 (좌측과 대칭)
      for (let c = 0; c < numSideCols; c++) {
        const x = ridgeRightX + c * (mW + calc.GAP_X);
        right.push({ x, y, w: mW, h: mL });
      }
    }

    const used = calc.usedLengthY(left.concat(right), calc.OFFSET);
    const gap = Math.max(0, avV - used);

    return {
      mode: 'reverse',
      modules: left.concat(right), left, right,
      sideCols: numSideCols, rows,
      avV, southGap: gap, northGap: gap,
      total: left.length + right.length,
      ridgeLeftX, ridgeRightX,
    };
  }
};

<script>
// ── 5. 렌더링 모듈 ────────────────────────────────────
const render = {
  draw() {
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!mapCtrl.ready) return;

    const st = ui.getState();
    const fit = mapCtrl.noMap || mapCtrl.drawingView; // 도면뷰: 건물이 화면에 꽉 차게
    if (fit) mapCtrl.autoFit(st);
    const mpp = mapCtrl.mPerPx;
    const bCenter = mapCtrl.buildingCenterScreen();

    // 건물이 정의된 경우에만 그린다(초기 잔상 방지)
    if (st.hasBuilding) {
      ctx.save();
      if (st.rotation) { // 건물 회전: 화면 중심(건물 중심) 기준 회전
        ctx.translate(bCenter.x, bCenter.y);
        ctx.rotate(st.rotation * Math.PI / 180);
        ctx.translate(-bCenter.x, -bCenter.y);
      }
      // 미터(건물 로컬) → 캔버스 픽셀. 캔버스 Y는 아래가 +이므로 북(+Y)은 위로 반전.
      const tx = (mx) => bCenter.x + (mx - st.buildingW / 2) / mpp;
      const ty = (my) => bCenter.y + (st.buildingH / 2 - my) / mpp;
      const px = (m) => m / mpp;

      // 1) 건물 외곽선(자주색)
      ctx.strokeStyle = '#8B008B'; ctx.lineWidth = 2; ctx.setLineDash([]);
      ctx.strokeRect(tx(0), ty(st.buildingH), px(st.buildingW), px(st.buildingH));
      // 2) 500mm 외벽 이격 빨간 점선
      const off = calc.OFFSET;
      ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 1; ctx.setLineDash([6, 4]);
      ctx.strokeRect(tx(off), ty(st.buildingH - off), px(st.buildingW - off * 2), px(st.buildingH - off * 2));
      ctx.setLineDash([]);
      // 3) 용마루(회색 띠)
      ctx.fillStyle = '#9a9a9a';
      if (st.forward) ctx.fillRect(tx(0), ty(st.buildingH / 2 + st.ridgeW / 2), px(st.buildingW), px(st.ridgeW));
      else ctx.fillRect(tx(st.buildingW / 2 - st.ridgeW / 2), ty(st.buildingH), px(st.ridgeW), px(st.buildingH));
      // 4) 모듈(밝은 하늘색 + 0.002m 빨간 테두리)
      const result = st.forward ? placement.forward(st) : placement.reverse(st);
      const borderPx = Math.max(1, px(0.002));
      ctx.setLineDash([]);
      for (const m of result.modules) {
        const X = tx(m.x), Y = ty(m.y + m.h), W = px(m.w), H = px(m.h);
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(X, Y, W, H);
        ctx.strokeStyle = '#ff0000'; ctx.lineWidth = borderPx; ctx.strokeRect(X, Y, W, H);
      }
      // 5) 방위/치수/영역 라벨
      this.drawLabels(ctx, st, tx, ty, px);
      ctx.restore();
      // 6) 상단 패널 갱신
      ui.updateResults(result);
    } else {
      ui.updateResults({ southGap: 0, northGap: 0, total: 0 });
    }

    // 7) 거리측정/건물그리기 오버레이(화면 좌표 — 회전 영향 없음)
    this.drawOverlay(ctx);
  },

  // 측정선 + 건물그리기 미리보기
  drawOverlay(ctx) {
    const m = mapCtrl;
    const seg = (a, b, color) => {
      ctx.save(); ctx.setLineDash([]); ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = color;
      [a, b].forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2); ctx.fill(); });
      const dist = Math.hypot(b.x - a.x, b.y - a.y) * m.mPerPx;
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const label = dist.toFixed(2) + ' m';
      ctx.font = 'bold 14px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      const w = ctx.measureText(label).width + 12;
      ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(mid.x - w / 2, mid.y - 24, w, 19);
      ctx.fillStyle = '#fff'; ctx.fillText(label, mid.x, mid.y - 7);
      ctx.restore();
    };
    if (m.measureA && m.measureB) seg(m.measureA, m.measureB, '#e67e22');
    else if (m.measureA && m.measurePreview) seg(m.measureA, m.measurePreview, '#e67e22');

    if (m.mode === 'draw' && m.drawA && m.drawPreview) {
      const a = m.drawA, b = m.drawPreview;
      ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = '#8B008B'; ctx.lineWidth = 2;
      ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
      const wM = Math.abs(b.x - a.x) * m.mPerPx, hM = Math.abs(b.y - a.y) * m.mPerPx;
      ctx.setLineDash([]); ctx.fillStyle = '#8B008B'; ctx.font = 'bold 13px Segoe UI'; ctx.textAlign = 'center';
      ctx.fillText(wM.toFixed(1) + ' × ' + hM.toFixed(1) + ' m', (a.x + b.x) / 2, Math.min(a.y, b.y) - 8);
      ctx.restore();
    }
  },

  drawLabels(ctx, st, tx, ty, px) {
    ctx.save();
    ctx.fillStyle = '#8B008B';
    ctx.font = 'bold 12px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 가로 치수(북측 외곽 위)
    ctx.fillText(st.buildingW.toFixed(1) + ' m', tx(st.buildingW / 2), ty(st.buildingH) - 12);
    // 세로 치수(서측 외곽 좌측, 세로쓰기)
    ctx.save();
    ctx.translate(tx(0) - 14, ty(st.buildingH / 2));
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(st.buildingH.toFixed(1) + ' m', 0, 0);
    ctx.restore();

    // 방위 표시(N) — 건물 북동쪽 바깥
    const nx = tx(st.buildingW) + 22, ny = ty(st.buildingH) + 4;
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.moveTo(nx, ny - 12); ctx.lineTo(nx - 5, ny + 2); ctx.lineTo(nx + 5, ny + 2);
    ctx.closePath(); ctx.fill();
    ctx.fillText('N', nx, ny + 12);

    // 영역 라벨(연회색)
    ctx.fillStyle = 'rgba(120,120,120,0.85)';
    ctx.font = 'bold 13px Segoe UI';
    if (st.forward) {
      ctx.fillText('북측', tx(st.buildingW / 2), ty(st.buildingH * 0.78));
      ctx.fillText('남측', tx(st.buildingW / 2), ty(st.buildingH * 0.22));
    } else {
      ctx.fillText('좌측', tx(st.buildingW * 0.25), ty(st.buildingH * 0.9));
      ctx.fillText('우측', tx(st.buildingW * 0.75), ty(st.buildingH * 0.9));
    }
    ctx.restore();
  }
};
</script>
<script>
// ── 6. 지도 컨트롤 모듈 ───────────────────────────────
const mapCtrl = {
  map: null,
  mPerPx: 1,
  buildingLatLng: null,
  moveMode: false,
  ready: false,       // init 또는 initNoMap 완료 후 true
  noMap: false,       // 카카오 SDK 미가용 시 도면 모드
  drawingView: false, // 지도 위가 아니라 화면 꽉 채운 도면뷰로 볼지
  mode: 'none',       // 캔버스 상호작용: 'none'|'move'|'measure'|'draw'
  measureA: null, measureB: null, measurePreview: null, // 거리측정 상태
  drawA: null, drawPreview: null,                       // 건물그리기 상태

  init() {
    const container = document.getElementById('map');
    this.map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: 1,   // 단일 건물 확인용 최대 확대
    });
    this.buildingLatLng = this.map.getCenter();
    this.resizeCanvas();
    this.updateScale();

    kakao.maps.event.addListener(this.map, 'zoom_changed', () => { this.updateScale(); render.draw(); });
    kakao.maps.event.addListener(this.map, 'center_changed', () => { render.draw(); });
    kakao.maps.event.addListener(this.map, 'bounds_changed', () => { this.updateScale(); render.draw(); });
    window.addEventListener('resize', () => { this.resizeCanvas(); this.updateScale(); render.draw(); });

    this.setupCanvas();
    this.ready = true;
  },

  // 카카오 SDK가 없을 때(도메인 미등록/서비스 비활성/오프라인): 지도 없이 도면만 렌더
  initNoMap() {
    this.noMap = true;
    this.ready = true;
    const mapDiv = document.getElementById('map');
    if (mapDiv) mapDiv.style.background = '#eef1f4';
    const banner = document.getElementById('nomap-banner');
    if (banner) banner.classList.add('show');
    this.resizeCanvas();
    window.addEventListener('resize', () => { this.resizeCanvas(); render.draw(); });
  },

  centerPx() {
    const canvas = document.getElementById('overlay-canvas');
    return { x: canvas.width / 2, y: canvas.height / 2 };
  },

  // 도면 모드: 건물(W×H)이 캔버스의 ~86%에 들어오도록 mPerPx 자동 산출
  autoFit(st) {
    const canvas = document.getElementById('overlay-canvas');
    const usableW = Math.max(1, canvas.width * 0.86);
    const usableH = Math.max(1, canvas.height * 0.86);
    const fit = Math.max(st.buildingW / usableW, st.buildingH / usableH);
    this.mPerPx = fit > 0 ? fit : 1;
  },

  // 건물 중심의 화면(캔버스) 좌표
  buildingCenterScreen() {
    return (this.noMap || this.drawingView) ? this.centerPx() : this.latLngToPx(this.buildingLatLng);
  },

  // 모든 캔버스 상호작용을 mode에 따라 처리(이동/측정/그리기)
  setupCanvas() {
    const canvas = document.getElementById('overlay-canvas');
    let dragging = false, startPx = null, startLatLng = null;

    canvas.addEventListener('mousedown', (e) => {
      if (this.mode !== 'move') return;
      const st = ui.getState();
      if (!st.hasBuilding) return;
      const p = this.canvasXY(e);
      const bpx = this.buildingCenterScreen();
      const halfW = (st.buildingW / 2) / this.mPerPx, halfH = (st.buildingH / 2) / this.mPerPx;
      if (Math.abs(p.x - bpx.x) <= halfW && Math.abs(p.y - bpx.y) <= halfH) {
        dragging = true; startPx = p; startLatLng = this.buildingLatLng; e.preventDefault();
      }
    });
    canvas.addEventListener('mousemove', (e) => {
      const p = this.canvasXY(e);
      if (this.mode === 'move' && dragging) {
        const dxM = (p.x - startPx.x) * this.mPerPx, dyM = (p.y - startPx.y) * this.mPerPx;
        this.buildingLatLng = this.offsetLatLng(startLatLng, dxM, -dyM); // 화면 아래(+dy)=남(-위도)
        render.draw();
      } else if (this.mode === 'measure' && this.measureA && !this.measureB) {
        this.measurePreview = p; render.draw();
      } else if (this.mode === 'draw' && this.drawA) {
        this.drawPreview = p; render.draw();
      }
    });
    const end = () => { dragging = false; };
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);

    canvas.addEventListener('click', (e) => {
      const p = this.canvasXY(e);
      if (this.mode === 'measure') this.measureClick(p);
      else if (this.mode === 'draw') this.drawClick(p);
    });
  },

  // 상호작용 모드 전환(none/move/measure/draw)
  setMode(mode) {
    this.mode = mode;
    this.moveMode = (mode === 'move');
    const canvas = document.getElementById('overlay-canvas');
    canvas.style.pointerEvents = (mode === 'none') ? 'none' : 'auto';
    canvas.style.cursor = (mode === 'measure' || mode === 'draw') ? 'crosshair' : (mode === 'move' ? 'move' : 'default');
    if (mode !== 'measure') { this.measureA = this.measureB = this.measurePreview = null; }
    if (mode !== 'draw') { this.drawA = this.drawPreview = null; }
    const hint = document.getElementById('move-hint');
    const msg = { move: '🟧 건물 이동 — 건물을 드래그', measure: '📏 거리측정 — 두 점을 클릭', draw: '✏️ 건물그리기 — 두 모서리(대각)를 클릭' }[mode];
    if (msg) { hint.textContent = msg; hint.classList.add('show'); } else hint.classList.remove('show');
    ui.syncToolButtons();
    render.draw();
  },

  measureClick(p) {
    if (!this.measureA || this.measureB) { this.measureA = p; this.measureB = null; this.measurePreview = null; }
    else { this.measureB = p; this.measurePreview = null; }
    render.draw();
  },

  drawClick(p) {
    if (!this.drawA) { this.drawA = p; this.drawPreview = null; render.draw(); return; }
    const a = this.drawA, b = p;
    const wM = Math.abs(b.x - a.x) * this.mPerPx, hM = Math.abs(b.y - a.y) * this.mPerPx;
    if (wM < 0.5 || hM < 0.5) { this.drawA = null; this.drawPreview = null; render.draw(); return; } // 너무 작으면 취소
    const st = ui.getState();
    st.buildingW = +wM.toFixed(2);
    st.buildingH = +hM.toFixed(2);
    st.rotation = 0;
    st.hasBuilding = true;
    st.forward = (wM >= hM);   // 가로≥세로 → 정방향, 세로가 길면 역방향
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (!this.noMap && !this.drawingView) this.buildingLatLng = this.pxToLatLng(mid);
    this.drawA = null; this.drawPreview = null;
    this.setMode('none');
    ui.syncFromState();
    render.draw();
  },

  pxToLatLng(p) {
    return this.map.getProjection().coordsFromContainerPoint(new kakao.maps.Point(p.x, p.y));
  },

  setMapType(type) {
    if (!this.map) return;    // 'road' | 'sat'
    if (type === 'sat') this.map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
    else this.map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
  },

  // 지도뷰 ⇄ 도면뷰(화면 꽉 채움). 카카오 미가용 시엔 항상 도면뷰.
  setView(mode) {
    if (this.noMap) return;
    this.drawingView = (mode === 'draw');
    const mapDiv = document.getElementById('map');
    if (mapDiv) mapDiv.style.visibility = this.drawingView ? 'hidden' : 'visible';
    render.draw();
  },

  centerBuilding() {
    if (!this.map) return;
    this.buildingLatLng = this.map.getCenter();
    render.draw();
  },

  resizeCanvas() {
    const wrap = document.getElementById('map-wrap');
    const canvas = document.getElementById('overlay-canvas');
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
  },

  updateScale() {
    // 컨테이너 좌표(줌 반영)로 m/px 산출. pointFromCoords(월드좌표)는 줌 무관이라 쓰면 안 됨.
    const proj = this.map.getProjection();
    const center = this.map.getCenter();
    const a = proj.containerPointFromCoords(center);
    const b = proj.containerPointFromCoords(new kakao.maps.LatLng(center.getLat(), center.getLng() + 0.001));
    const pxDist = Math.abs(b.x - a.x);
    const mDist = 111320 * Math.cos(center.getLat() * Math.PI / 180) * 0.001;
    this.mPerPx = pxDist > 0 ? mDist / pxDist : 1;
  },

  latLngToPx(latlng) {
    // 컨테이너 픽셀(지도 좌상단 기준)을 그대로 캔버스 좌표로 사용
    const cp = this.map.getProjection().containerPointFromCoords(latlng);
    return { x: cp.x, y: cp.y };
  },

  canvasXY(e) {
    const rect = document.getElementById('overlay-canvas').getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  },

  offsetLatLng(latlng, dxM, dyM) {
    const lat = latlng.getLat() + (dyM / 111320);
    const lng = latlng.getLng() + (dxM / (111320 * Math.cos(latlng.getLat() * Math.PI / 180)));
    return new kakao.maps.LatLng(lat, lng);
  }
};
</script>
<script>
// ── 7. 우측 패널 모듈 ─────────────────────────────────
const kepcoPanel = {
  update(addrObj, rawAddr) {
    let province = '', district = '';
    if (addrObj && addrObj.region_1depth_name) {
      province = addrObj.region_1depth_name || '';
      district = addrObj.region_2depth_name || '';
    } else {
      const parts = (rawAddr || '').split(/[\s,]+/);
      province = parts[0] || '';
      district = parts[1] || '';
    }

    const provKey = Object.keys(KEPCO_DATA).find(k => province.includes(k)) || '';
    const kepco = KEPCO_DATA[provKey];
    const local = LOCAL_DATA[provKey];

    const kepcoDiv = document.getElementById('rp-kepco');
    if (kepco) {
      const subKey = Object.keys(kepco.regions || {}).find(k => district.includes(k));
      const sub = subKey ? kepco.regions[subKey] : null;
      kepcoDiv.innerHTML = `
        <h3>KEPCO 담당자</h3>
        <h4>${kepco.office}</h4>
        <div class="contact-item"><strong>부서:</strong> ${kepco.dept} (신증설 설계·시공)</div>
        <div class="contact-item"><strong>대표:</strong> <a href="tel:${kepco.tel}">${kepco.tel}</a></div>
        <div class="contact-item"><strong>주소:</strong> ${kepco.address}</div>
        ${sub ? `
          <hr class="rp-hr">
          <h4>${sub.name}</h4>
          <div class="contact-item"><strong>전화:</strong> <a href="tel:${sub.tel}">${sub.tel}</a></div>
          <div class="contact-item"><strong>담당:</strong> ${sub.manager}</div>
        ` : ''}
        <div class="contact-item" style="margin-top:6px;color:#999;">※ 선로 여유 용량은 아래 ‘선로 여유 용량 조회’ 링크에서 해당 주소로 확인하세요.</div>
      `;
    } else {
      kepcoDiv.innerHTML = `<h3>KEPCO 담당자</h3><p class="no-data">해당 지역 데이터 없음. 아래 링크에서 확인하세요.</p>`;
    }

    const localDiv = document.getElementById('rp-local');
    if (local) {
      const subKey = Object.keys(local.regions || {}).find(k => district.includes(k));
      const sub = subKey ? local.regions[subKey] : null;
      const elec = (sub && sub.elec) ? sub.elec : local.elec;
      const dev = (sub && sub.devact) ? sub.devact : local.devact;
      localDiv.innerHTML = `
        <h3>지자체 담당자</h3>
        <h4>전기사업 담당</h4>
        <div class="contact-item"><strong>부서:</strong> ${elec.dept}</div>
        <div class="contact-item"><strong>전화:</strong> <a href="tel:${elec.tel}">${elec.tel}</a></div>
        <hr class="rp-hr">
        <h4>개발행위 담당</h4>
        <div class="contact-item"><strong>부서:</strong> ${dev.dept}</div>
        <div class="contact-item"><strong>전화:</strong> <a href="tel:${dev.tel}">${dev.tel}</a></div>
      `;
    } else {
      localDiv.innerHTML = `<h3>지자체 담당자</h3><p class="no-data">해당 지역 데이터 없음.</p>`;
    }
  }
};
</script>
<script>
// ── 8. UI 모듈 (진입점) ───────────────────────────────
const ui = {
  state: {
    model: 'hanwha2', wp: 500,
    buildingW: 20, buildingH: 30, ridgeW: 0.5,
    angle: 10, forward: true, spaced: true,
    hasBuilding: false, // 건물이 정의되기 전엔 아무것도 그리지 않음(초기 잔상 제거)
    rotation: 0,        // 건물 회전(도) — 기울어진 옥상 정렬
  },
  getState() { return this.state; },

  updateResults(result) {
    const st = this.state;
    const { L, Gap, Pitch } = calc.fromAngle(st.angle);
    const $ = (id) => document.getElementById(id);

    $('res-L').textContent = L.toFixed(3);
    $('res-Gap').textContent = Gap.toFixed(3);
    $('res-Pitch').textContent = Pitch.toFixed(3);

    // 실제 렌더링된 모듈 기준 집계
    $('res-south').textContent = result.southGap.toFixed(3);
    $('res-north').textContent = result.northGap.toFixed(3);
    $('res-count').textContent = result.total;
    $('res-cap').textContent = (result.total * st.wp / 1000).toFixed(3);
    $('res-series').textContent = '직병렬: ' + series.solve(result.total).text;
  },

  searchAddress() {
    const addr = document.getElementById('inp-addr').value.trim();
    if (!addr) return;
    // 지도 미연결(도면 모드): 지오코딩은 불가하나 입력 주소로 KEPCO/지자체 패널은 채운다
    if (mapCtrl.noMap || typeof kakao === 'undefined' || !kakao.maps || !kakao.maps.services) {
      kepcoPanel.update(null, addr);
      return;
    }
    const geocoder = new kakao.maps.services.Geocoder();
    geocoder.addressSearch(addr, (result, status) => {
      if (status === kakao.maps.services.Status.OK) {
        const latlng = new kakao.maps.LatLng(parseFloat(result[0].y), parseFloat(result[0].x));
        mapCtrl.map.setLevel(1);   // 옥상이 보이도록 최대 확대
        mapCtrl.map.setCenter(latlng);
        mapCtrl.buildingLatLng = latlng;
        mapCtrl.updateScale();
        render.draw();
        kepcoPanel.update(result[0].address, addr);
      } else {
        alert('주소를 찾을 수 없습니다: ' + addr);
      }
    });
  },

  // 두 토글 버튼(A/B) 묶음 처리 헬퍼
  bindToggle(idA, idB, onA, onB) {
    const a = document.getElementById(idA), b = document.getElementById(idB);
    a.addEventListener('click', () => { a.classList.add('active'); b.classList.remove('active'); onA(); render.draw(); });
    b.addEventListener('click', () => { b.classList.add('active'); a.classList.remove('active'); onB(); render.draw(); });
  },

  bindNumber(id, key, fallback) {
    document.getElementById(id).addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      this.state[key] = (v > 0) ? v : fallback;
      if (key === 'buildingW' || key === 'buildingH' || key === 'ridgeW') this.state.hasBuilding = true;
      render.draw();
    });
  },

  init() {
    const s = this.state;

    document.getElementById('sel-model').addEventListener('change', (e) => { s.model = e.target.value; render.draw(); });
    this.bindNumber('inp-wp', 'wp', 500);
    this.bindNumber('inp-bw', 'buildingW', 20);
    this.bindNumber('inp-bh', 'buildingH', 30);
    this.bindNumber('inp-ridge', 'ridgeW', 0.5);

    document.getElementById('sl-angle').addEventListener('input', (e) => {
      s.angle = parseFloat(e.target.value);
      document.getElementById('lbl-angle').textContent = s.angle;
      render.draw();
    });

    this.bindToggle('btn-forward', 'btn-reverse', () => s.forward = true, () => s.forward = false);
    this.bindToggle('btn-tight', 'btn-spaced', () => s.spaced = false, () => s.spaced = true);
    this.bindToggle('btn-mapview', 'btn-drawview', () => mapCtrl.setView('map'), () => mapCtrl.setView('draw'));
    this.bindToggle('btn-road', 'btn-sat', () => mapCtrl.setMapType('road'), () => mapCtrl.setMapType('sat'));

    // 캔버스 도구(이동/측정/그리기): 같은 버튼 다시 누르면 해제
    const toolBtn = (id, mode) => {
      document.getElementById(id).addEventListener('click', () => {
        mapCtrl.setMode(mapCtrl.mode === mode ? 'none' : mode);
      });
    };
    toolBtn('btn-move', 'move');
    toolBtn('btn-measure', 'measure');
    toolBtn('btn-draw', 'draw');
    document.getElementById('btn-clear').addEventListener('click', () => this.clearAll());
    document.getElementById('btn-center').addEventListener('click', () => mapCtrl.centerBuilding());

    // 건물 회전(방향 조절)
    document.getElementById('sl-rot').addEventListener('input', (e) => {
      s.rotation = parseFloat(e.target.value) || 0;
      document.getElementById('lbl-rot').textContent = s.rotation;
      render.draw();
    });

    document.getElementById('inp-addr').addEventListener('keydown', (e) => { if (e.key === 'Enter') this.searchAddress(); });

    render.draw();
  },

  // 도구 버튼 활성표시 동기화
  syncToolButtons() {
    const set = (id, on) => document.getElementById(id).classList.toggle('move-active', on);
    set('btn-move', mapCtrl.mode === 'move');
    set('btn-measure', mapCtrl.mode === 'measure');
    set('btn-draw', mapCtrl.mode === 'draw');
  },

  // state → 입력칸·정/역 버튼 반영(건물그리기 자동 산출 후)
  syncFromState() {
    const s = this.state;
    document.getElementById('inp-bw').value = s.buildingW;
    document.getElementById('inp-bh').value = s.buildingH;
    document.getElementById('sl-rot').value = s.rotation;
    document.getElementById('lbl-rot').textContent = s.rotation;
    document.getElementById('btn-forward').classList.toggle('active', s.forward);
    document.getElementById('btn-reverse').classList.toggle('active', !s.forward);
  },

  // 지우기: 건물·모듈·측정 모두 제거
  clearAll() {
    this.state.hasBuilding = false;
    this.state.rotation = 0;
    document.getElementById('sl-rot').value = 0;
    document.getElementById('lbl-rot').textContent = '0';
    mapCtrl.setMode('none'); // 측정/그리기 상태 초기화 + 재렌더
  }
};

// 부트스트랩: 카카오 SDK가 정상 로드됐으면 지도 모드, 아니면 도면 모드로 폴백
function bootstrapApp() {
  if (window.__solarBooted) return;
  window.__solarBooted = true;
  const hasKakao = (typeof kakao !== 'undefined' && kakao.maps && typeof kakao.maps.load === 'function');
  if (hasKakao) {
    kakao.maps.load(() => { mapCtrl.init(); ui.init(); });
  } else {
    mapCtrl.initNoMap();   // 도메인 미등록/서비스 비활성/오프라인 → 지도 없이 도면만
    ui.init();
  }
}
window.addEventListener('load', () => setTimeout(bootstrapApp, 200));
</script>
